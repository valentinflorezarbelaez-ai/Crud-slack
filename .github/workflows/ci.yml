name: EOS Sovereign 7-Stage CI/CD Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-strict:
    name: 7-Stage SecDevOps & BDD Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Execute Strict 7-Stage Verification Gate
        run: npm run verify:strict
